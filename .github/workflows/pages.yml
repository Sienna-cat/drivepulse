name: Deploy online demo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - run: npm run build:static
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Wait for the uploaded Pages artifact
        uses: actions/github-script@v7
        with:
          script: |
            const name = `github-pages-${context.runId}-${process.env.GITHUB_RUN_ATTEMPT}`;
            for (let attempt = 0; attempt < 12; attempt++) {
              const { data } = await github.rest.actions.listWorkflowRunArtifacts({
                ...context.repo, run_id: context.runId,
              });
              if (data.artifacts.some(artifact => artifact.name === name && !artifact.expired)) return;
              core.info('Waiting for the uploaded artifact to become available.');
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            core.setFailed('The uploaded Pages artifact is not yet available.');
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
